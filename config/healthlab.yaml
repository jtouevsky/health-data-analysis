# HealthLab configuration: the single place for paths, aggregation rules,
# thresholds and analysis parameters. Every non-obvious value here is
# justified in DECISIONS.md.

paths:
  db: data/healthlab.db                 # real database (gitignored)
  raw_export: data/raw/export.zip
  demo_db: data/demo/healthlab.db       # used when DEMO_MODE=1 or demo_mode: true
  demo_export: data/demo/export.zip

demo_mode: false        # overridden by the DEMO_MODE environment variable

time:
  # Apple re-renders every timestamp in the phone's *current* offset at export
  # time, so the per-record offset is not the offset in force when the sample was
  # taken. Local dates are therefore computed by converting the UTC instant into
  # an IANA zone (DST-aware): `timezone` by default, or the zone of an override
  # period below. Set local_date_mode: offset to use the per-record offset instead
  # (correct only for exports that preserve it).
  timezone: America/Los_Angeles
  local_date_mode: zone            # zone | offset
  # Override periods: inclusive local dates in the override zone -> IANA zone.
  # A labelled override also becomes a seasonal-comparison period of that label,
  # so travel dates are entered once. Changing these only needs `healthlab rollup`.
  overrides: []
  #  - {start: "2024-06-20", end: "2024-08-25", timezone: Europe/Sofia, label: bulgaria_summer}
  #  - {start: "2025-06-18", end: "2025-08-28", timezone: Europe/Sofia, label: bulgaria_summer}

ingest:
  batch_size: 10000
  skip_types:                      # types stored as records but never rolled up
    - HKDataTypeSleepDurationGoal

# ---------------------------------------------------------------------------
# Daily rollup rules. One entry per HealthKit type.
#   name:  column name in the `daily` table
#   agg:   sum | mean | last | max | min | leq | count | sleep
#   unit:  canonical unit; raw values are converted to it (see units.py)
#   kind:  activity | gait | audio | energy | sleep | other
#   plausible: [lo, hi] daily-value range used for outlier flags
#   zero_fill: true -> a day with no samples is 0 (not missing) when the phone was
#              demonstrably in use that day (rollup.zero_fill_anchor has data)
# Types not listed are still ingested and rolled up with default_rules below.
# ---------------------------------------------------------------------------
metrics:
  HKQuantityTypeIdentifierStepCount:            {name: steps, agg: sum, unit: count, kind: activity, label: Steps, plausible: [0, 60000]}
  HKQuantityTypeIdentifierDistanceWalkingRunning: {name: distance_km, agg: sum, unit: km, kind: activity, label: Walking + running distance, plausible: [0, 60]}
  HKQuantityTypeIdentifierFlightsClimbed:       {name: flights, agg: sum, unit: count, kind: activity, label: Flights climbed, plausible: [0, 200], zero_fill: true}
  HKQuantityTypeIdentifierActiveEnergyBurned:   {name: active_kcal, agg: sum, unit: kcal, kind: energy, label: Active energy (Apple est.), plausible: [0, 3000]}
  HKQuantityTypeIdentifierBasalEnergyBurned:    {name: basal_kcal, agg: sum, unit: kcal, kind: energy, label: Basal energy (Apple est.), plausible: [800, 3000]}
  HKQuantityTypeIdentifierWalkingSpeed:         {name: walking_speed_kmh, agg: mean, unit: km/hr, kind: gait, label: Walking speed, plausible: [1, 8]}
  HKQuantityTypeIdentifierWalkingStepLength:    {name: step_length_cm, agg: mean, unit: cm, kind: gait, label: Step length, plausible: [30, 120]}
  HKQuantityTypeIdentifierWalkingDoubleSupportPercentage: {name: double_support_pct, agg: mean, unit: "%", kind: gait, label: Double support time, plausible: [10, 50]}
  HKQuantityTypeIdentifierWalkingAsymmetryPercentage:     {name: asymmetry_pct, agg: mean, unit: "%", kind: gait, label: Walking asymmetry, plausible: [0, 100]}
  HKQuantityTypeIdentifierAppleWalkingSteadiness: {name: walking_steadiness_pct, agg: mean, unit: "%", kind: gait, label: Walking steadiness, plausible: [0, 100]}
  HKQuantityTypeIdentifierHeadphoneAudioExposure: {name: headphone_db, agg: leq, unit: dBASPL, kind: audio, label: Headphone level (LAeq), plausible: [30, 110]}
  HKCategoryTypeIdentifierHeadphoneAudioExposureEvent: {name: headphone_alerts, agg: count, unit: count, kind: audio, label: Headphone loudness alerts, zero_fill: true}
  HKCategoryTypeIdentifierSleepAnalysis:        {name: sleep, agg: sleep, unit: hr, kind: sleep, label: Sleep}

default_rules:
  # Applied to any type not listed above, keyed on the canonical unit.
  cumulative_units: [count, kcal, kJ, km, m, cm, g, mg, mcg, mL, L, min, s, hr]
  cumulative_agg: sum
  sample_agg: mean
  category_agg: count

# Source deduplication: for each (type, local day) only the highest-priority
# source that has data that day is used. Sources not listed rank below listed
# ones, ordered by their total record count for that type (most first).
rollup:
  zero_fill_anchor: steps   # 'phone was carried' signal for zero_fill metrics

# Sources to ignore in all rollups and analyses (records stay in the database).
# Matching ignores case and treats ’ and ' alike. Check the "Sources & devices"
# section of the Data Quality page to see which devices are yours.
source_exclude:
  all: []                  # e.g. ["Another Person's iPhone"]
  # HKQuantityTypeIdentifierStepCount: ["Old iPod touch"]

source_priority:
  default: []           # e.g. ["Someone's iPhone"]
  # HKQuantityTypeIdentifierActiveEnergyBurned: ["iPhone", "MyFitnessPal"]

quality:
  gap_min_days: 3         # report runs of >= this many missing days
  outlier_window_days: 28
  outlier_mad_k: 5.0

analysis:
  start_date: null        # e.g. "2022-01-01"; null = use all data
  min_coverage_days: 30   # metrics with fewer observed days are hidden from analyses

correlations:
  min_n: 60
  max_lag: 3
  default_transform: detrend  # detrend | diff | raw  (see DECISIONS.md C2)
  detrend_window_days: 28
  fdr_alpha: 0.05
  effective_n: true           # adjust p for residual lag-1 autocorrelation
  # Mechanically linked pairs (by definition, biomechanics or measurement artifact).
  # Flagged and ranked after everything else so they don't crowd out real hypotheses.
  definitional_pairs:
    - [steps, distance_km]
    - [steps, active_kcal]
    - [distance_km, active_kcal]
    - [steps, flights]
    - [walking_speed_kmh, step_length_cm]
    - [active_kcal, basal_kcal]
    - [active_kcal, flights]               # climbing is part of active energy
    - [double_support_pct, walking_speed_kmh]   # gait biomechanics
    - [double_support_pct, step_length_cm]
    # Artifact: the iPhone basal estimate only accrues while the phone is recording,
    # so its daily total scales with how much the phone was carried.
    - [basal_kcal, steps]
    - [basal_kcal, distance_km]
    - [basal_kcal, flights]
    - [basal_kcal, walking_speed_kmh]
    - [basal_kcal, step_length_cm]

seasonal:
  bootstrap_reps: 2000
  block_days: 7
  seed: 42
  # label -> list of [start, end] inclusive date ranges. Labelled time-zone
  # overrides (time.overrides) are merged in automatically, so bulgaria_summer
  # normally needs no entry here.
  periods:
    school_year: []            # e.g. [["2023-09-01", "2024-06-10"], ["2024-09-03", "2025-06-12"]]

changepoints:
  metrics: [steps, distance_km, walking_speed_kmh, step_length_cm, asymmetry_pct, double_support_pct]
  resolution: week            # week | day  (weekly means of days, weeks need >= min_obs_per_week days)
  min_obs_per_week: 4
  min_segment: 4              # bins (4 weeks): shorter regimes are not reported
  penalty_multiplier: 1.0     # x BIC penalty 2*log(n) on the long-run-standardised series
  log_metrics: [steps, distance_km]   # multiplicative shifts
  sensitivity_multipliers: [0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  stability_tolerance: 2      # bins
  max_phi: 0.8                # cap on the autocorrelation inflation of the noise scale
  winsor: 3.0                 # clip the standardised series at +/- this many long-run SDs
  bocpd_expected_run: 26      # bins (half a year at weekly resolution)
  bocpd_min_run: 4
  block_days: 7
  bootstrap_reps: 1000
  seed: 0
  event_tolerance_days: 21    # match a changepoint to an event within this many days
  # Annotate the timeline with life events (date = first day of the new situation).
  life_events: []
  #  - {date: "2024-09-01", label: "Started university"}
  #  - {date: "2025-01-15", label: "Moved apartments"}

forecast:
  targets: [steps, walking_speed_kmh]
  horizon_days: 7
  n_splits: 12             # rolling-origin folds of horizon_days each
  max_train_days: 730
  sarimax_order: [1, 0, 1]
  sarimax_seasonal_order: [1, 0, 1, 7]
  tree_lags: [7, 8, 14, 21, 28]
  seed: 0

demo:
  source_exclude:
    all: ["Partner's iPhone"]   # a synthetic foreign device (see synth.py)
  start_date: "2025-04-01"
  days: 548
  seed: 2024
  timezone_overrides:
    - {start: "2025-06-20", end: "2025-08-25", timezone: Europe/Sofia, label: bulgaria_summer}
    - {start: "2026-06-20", end: "2026-08-25", timezone: Europe/Sofia, label: bulgaria_summer}
  periods:
    school_year: [["2025-04-01", "2025-06-12"], ["2025-09-03", "2026-06-12"]]
  life_events:
    - {date: "2025-11-17", label: "New job with a car commute (synthetic)"}
    - {date: "2026-03-16", label: "Ankle injury (synthetic)"}
    - {date: "2026-04-27", label: "Cleared to walk normally (synthetic)"}
